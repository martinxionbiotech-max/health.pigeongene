site_name: PigeonGene 健康知识库
site_url: https://health.senopigeon.com
site_description: 赛鸽健康与疾病知识库：12 种病原检测、PCR 技术、生物安全与疾病防控的权威解读
site_author: 张家口赛诺生物科技有限公司
copyright: © 张家口赛诺生物科技有限公司（SENO Biotech）

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - scheme: default
      primary: red
      accent: pink
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: red
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - content.code.copy
  icon:
    logo: material/dna

nav:
  - 首页: index.md
  - 病原百科:
      - 病原百科总览: diseases/index.md
      - 鸽子白色念珠菌: diseases/baise-nianzhujun.md
      - 鸽痘病毒: diseases/ge-dou-bingdu.md
      - 鸽多瘤病毒: diseases/ge-duoliu-bingdu.md
      - 鸽轮状病毒: diseases/ge-lunzhuang-bingdu.md
      - 鸽毛滴虫: diseases/ge-maodichong.md
      - 鸽子疱疹病毒: diseases/ge-paozhen-bingdu.md
      - 鸽腺病毒: diseases/ge-xian-bingdu.md
      - 鸽圆环病毒: diseases/ge-yuanhuan-bingdu.md
      - 沙门氏菌: diseases/shamen-shijun.md
      - 新城疫病毒: diseases/xinchengyi-bingdu.md
      - 鹦鹉热衣原体: diseases/yingwure-yiyuanti.md
      - 支原体: diseases/zhiyuanti.md
  - 病原分类:
      - 病毒检测: categories/viruses.md
      - 细菌检测: categories/bacteria.md
      - 寄生虫检测: categories/parasites.md
  - 检测与防控:
      - 检测与防控总览: guides/index.md
      - PCR 检测: guides/pcr-testing.md
      - 生物安全: guides/biosecurity.md
      - 症状索引: guides/symptoms.md
      - 疾病预防: guides/prevention.md
      - 鸽舍健康: guides/loft-health.md
      - 诊断方法: guides/diagnostics.md
      - 疫苗免疫: guides/vaccination.md
      - 比赛季健康: guides/race-season-health.md
      - 幼鸽健康: guides/young-pigeon-health.md
  - 术语表: glossary.md
  - 常见问题: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: zh
