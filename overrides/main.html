{% extends "base.html" %}
{% block extrahead %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://health.pigeongene.com/#organization",
        "name": "张家口赛诺生物科技有限公司",
        "alternateName": ["PigeonGene · SENO Biotech", "赛诺生物"],
        "legalName": "张家口赛诺生物科技有限公司",
        "url": "https://pigeongene.com",
        "logo": "https://pigeongene.com/wp-content/uploads/cropped-cropped-LOGO.png",
        "description": "国家高新技术企业，专注赛鸽飞行能力基因检测、病毒检测与 DNA 身份证/亲缘鉴定。",
        "foundingDate": "2014",
        "numberOfEmployees": { "@type": "QuantitativeValue", "value": 15 },
        "award": ["国家高新技术企业", "张家口市重点基因检测实验室", "科技型中小企业"],
        "hasCredential": { "@type": "EducationalOccupationalCredential", "name": "ISO 9001 质量管理体系认证" },
        "knowsAbout": ["赛鸽飞行能力基因检测", "赛鸽病毒检测", "DNA 身份证", "亲缘鉴定", "实时荧光定量 PCR", "禽类分子诊断"],
        "areaServed": "Worldwide",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "CN",
          "addressRegion": "河北省",
          "addressLocality": "张家口市",
          "postalCode": "075000",
          "streetAddress": "桥东区北硅谷 3 号楼"
        },
        "email": "martin@dnatestingexperts.com",
        "telephone": "+86-13323237275",
        "sameAs": [
          "https://pigeongene.com",
          "https://genetics.pigeongene.com",
          "https://health.pigeongene.com",
          "https://research.pigeongene.com",
          "https://tools.pigeongene.com"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://health.pigeongene.com/#website",
        "name": "PigeonGene 健康知识库",
        "url": "https://health.pigeongene.com/",
        "description": "赛鸽健康与疾病知识库：12 种病原检测、PCR 技术、生物安全与疾病防控的权威解读",
        "publisher": { "@id": "https://health.pigeongene.com/#organization" },
        "inLanguage": "zh-CN"
      },
      {% if page and page.meta and page.meta.schema_type == 'article' %}
      {
        "@type": "Article",
        "@id": "{{ page.canonical_url }}#article",
        "headline": "{{ page.title }}",
        "description": "{{ page.meta.description }}",
        "url": "{{ page.canonical_url }}",
        "author": { "@id": "https://health.pigeongene.com/#organization" },
        "publisher": { "@id": "https://health.pigeongene.com/#organization" },
        "inLanguage": "zh-CN",
        "mainEntityOfPage": "{{ page.canonical_url }}"
      },
      {% elif page and page.meta and page.meta.schema_type == 'medicalcondition' %}
      {
        "@type": "MedicalWebPage",
        "@id": "{{ page.canonical_url }}#medicalwebpage",
        "name": "{{ page.title }}",
        "description": "{{ page.meta.description }}",
        "url": "{{ page.canonical_url }}",
        "mainEntity": {
          "@type": "MedicalCondition",
          "name": "{{ page.title }}",
          "description": "{{ page.meta.description }}",
          "url": "{{ page.canonical_url }}"
        },
        "publisher": { "@id": "https://health.pigeongene.com/#organization" },
        "inLanguage": "zh-CN"
      },
      {% elif page and page.meta and page.meta.schema_type == 'scholarlyarticle' %}
      {
        "@type": "ScholarlyArticle",
        "@id": "{{ page.canonical_url }}#scholarlyarticle",
        "headline": "{{ page.title }}",
        "description": "{{ page.meta.description }}",
        "url": "{{ page.canonical_url }}",
        "author": { "@id": "https://health.pigeongene.com/#organization" },
        "publisher": { "@id": "https://health.pigeongene.com/#organization" },
        "inLanguage": "zh-CN",
        "mainEntityOfPage": "{{ page.canonical_url }}"
      },      {% elif page and page.meta and page.meta.schema_type == 'faqpage' %}
      {
        "@type": "FAQPage",
        "@id": "{{ page.canonical_url }}#faqpage",
        "url": "{{ page.canonical_url }}",
        "inLanguage": "zh-CN",
        "mainEntity": [
          {% for item in page.meta.faq %}
          {
            "@type": "Question",
            "name": "{{ item.q }}",
            "acceptedAnswer": { "@type": "Answer", "text": "{{ item.a }}" }
          }{% if not loop.last %},{% endif %}
          {% endfor %}
        ]
      },
{% elif page and page.meta and page.meta.schema_type == 'definedtermset' %}
      {
        "@type": "DefinedTermSet",
        "@id": "{{ page.canonical_url }}#definedtermset",
        "name": "{{ page.title }}",
        "description": "{{ page.meta.description }}",
        "url": "{{ page.canonical_url }}"
      },
      {% elif page and page.meta and page.meta.schema_type == 'collectionpage' %}
      {
        "@type": "CollectionPage",
        "@id": "{{ page.canonical_url }}#collectionpage",
        "name": "{{ page.title }}",
        "description": "{{ page.meta.description }}",
        "url": "{{ page.canonical_url }}"
      },
      {% elif page and page.meta and page.meta.schema_type == 'home' %}
      {
        "@type": "WebPage",
        "@id": "{{ page.canonical_url }}#webpage",
        "name": "{{ page.title }}",
        "description": "{{ page.meta.description }}",
        "url": "{{ page.canonical_url }}",
        "about": { "@id": "https://health.pigeongene.com/#organization" }
      },
      {% endif %}
      {
        "@type": "BreadcrumbList",
        "@id": "{{ page.canonical_url }}#breadcrumb",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "首页", "item": "https://health.pigeongene.com/" },
          { "@type": "ListItem", "position": 2, "name": "{{ page.title }}", "item": "{{ page.canonical_url }}" }
        ]
      }
    ]
  }
  </script>
{% endblock %}
